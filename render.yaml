services:
  - type: web
    name: thermosolve-api
    runtime: python
    plan: free
    branch: master
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: THERMOSOLVE_CORS_ORIGINS
        sync: false   # Render asks for the value when you create the Blueprint